# =============================================================================
# CareerFlux frontend — static assets plus the API proxy.
#
# NOT a finished nginx config: the image installs this as an nginx TEMPLATE and
# the official entrypoint expands it at container start. Only names beginning
# `CAREERFLUX_` are substituted (NGINX_ENVSUBST_FILTER in the Dockerfile), so
# nginx's own `$host`, `$remote_addr`, `$uri` and friends survive untouched —
# without that filter the default entrypoint would eat every one of them.
#
# What varies by platform, and nothing else does:
#
#   CAREERFLUX_BACKEND_ORIGIN   where the backend is, INCLUDING the scheme
#   CAREERFLUX_BACKEND_HOST     the Host header the backend is addressed by
#   CAREERFLUX_FORWARDED_PROTO  the scheme the BROWSER used, for the backend
#   CAREERFLUX_LISTEN_PORT      the port this container serves on
#
# The last three exist because a managed platform is not a compose network. On
# Compose the backend is a container on a private bridge: plain HTTP, addressed
# by service name, and this nginx is the edge, so the browser's scheme is this
# request's scheme. On Render the backend is a public service behind the same
# TLS-terminating edge as this one, and all three of those stop being true:
#
#   * it answers only over HTTPS, and redirects HTTP to it
#   * that edge routes on the HOST HEADER, so sending this service's own
#     hostname sends the request straight back here — the request loops through
#     the edge until the browser gives up with ERR_TOO_MANY_REDIRECTS
#   * TLS is terminated in front of this container, so $scheme here is `http`
#     even though the browser used `https`
#
# The Dockerfile defaults every one of them to its Compose value — including
# the two that default to nginx's own `$host` and `$scheme` — so a plain
# `docker compose up` behaves exactly as it did before they existed.
#
# This container is the application's reverse proxy: it serves the built SPA and
# forwards /api to the backend, so the browser talks to exactly one origin and
# the backend needs no public address of its own.
#
# That does NOT mean CORS is out of the picture. Browsers send an Origin header
# on POST, PUT and DELETE even same-origin, and Spring checks it against
# CAREERFLUX_CORS_ORIGINS. If that list does not contain the exact origin people
# actually type, every write fails with a bare "Invalid CORS request" and the app
# looks broken while every GET keeps working. Reaching the same deployment on
# http://localhost:8081 and http://127.0.0.1:8081 is enough to trigger it.
#
# TLS does NOT terminate here. See docs/DEPLOYMENT.md — either a host reverse
# proxy or a hosting platform terminates HTTPS in front of this container.
# =============================================================================

# Where the real client address comes from.
#
# Empty by default, which means nginx trusts nobody and `$remote_addr` is the
# peer that actually opened the socket. That is correct when this container is
# the edge.
#
# Put a `set_real_ip_from <CIDR>;` line in a file here when something else sits
# in front — otherwise every request appears to come from that proxy, and the
# sign-in rate limiter loses its per-address component (it still limits per
# account, so it keeps working; it just stops distinguishing sources).
#
# Never trust a range you do not control. `X-Forwarded-For` is written by
# whoever sends the request, so trusting an open range lets an attacker claim
# any address they like.
include /etc/nginx/realip/*.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen ${CAREERFLUX_LISTEN_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # Applies to the SPA shell and assets. The API sets its own headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy is set per-location rather than here, because a
    # block that declares any add_header inherits none from its parent — see the
    # note in /assets/ below. The policy itself allows no inline script and no
    # eval; the app is built to work without either.

    # For the container healthcheck. Local only — it says nothing and reaches
    # nothing, so it is not an information leak, but there is no reason for it
    # to be routable from outside either.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not redundant: a block that declares any add_header inherits
        # none from its parent, so omitting these here would quietly drop the
        # security headers from every asset response.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Source maps are not built for production, so this only matters if somebody
    # turns them back on. Refusing to serve them keeps the frontend source off
    # the public internet either way.
    location ~ \.map$ {
        return 404;
    }

    # The API. Same origin as the app, so no CORS preflight and no third-party
    # cookie behaviour to reason about.
    location /api/ {
        # Carries its own scheme. Substituted at container start, so nginx sees
        # a literal upstream and needs no `resolver`.
        #
        #   Compose  http://backend:8080          a container on the bridge
        #   Render   https://<backend>.onrender.com   a public service
        #
        # The scheme is part of the value rather than hardcoded here because a
        # literal `http://` in front of it produced `http://https://...`, which
        # nginx rejects as an invalid port.
        proxy_pass ${CAREERFLUX_BACKEND_ORIGIN};
        proxy_http_version 1.1;

        # Whose name to ask for. On Compose this is the browser's own host and
        # nothing routes on it. On Render the shared edge routes on it, so
        # sending this service's hostname would hand the request back to this
        # service — the loop that shows up in a browser as
        # ERR_TOO_MANY_REDIRECTS rather than as anything mentioning nginx.
        proxy_set_header Host ${CAREERFLUX_BACKEND_HOST};

        # Send SNI as well, taken from the host in proxy_pass above. A TLS
        # upstream sharing an address with other tenants cannot select a
        # certificate — or a backend — without it. Ignored for an HTTP upstream,
        # so Compose is unaffected.
        proxy_ssl_server_name on;

        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append. `$proxy_add_x_forwarded_for` keeps
        # whatever the caller sent and adds to it, so a client could put any
        # address at the front of the list and the backend would believe it.
        # After the real_ip block above, `$remote_addr` is already the true
        # client address.
        proxy_set_header X-Forwarded-For $remote_addr;

        # The scheme the BROWSER used, which is not always this request's. Where
        # TLS terminates in front of this container, `$scheme` is `http` and
        # would tell the backend the session was never encrypted. Stated as a
        # value rather than read from an inbound X-Forwarded-Proto, for the same
        # reason X-Forwarded-For is overwritten above: a header a client can
        # write is not evidence of anything.
        proxy_set_header X-Forwarded-Proto ${CAREERFLUX_FORWARDED_PROTO};

        # Resume uploads are capped at 8 MB by the application.
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    # Actuator is not proxied. Health is checked on the backend directly, from
    # inside the network; publishing it through the public origin would describe
    # the infrastructure to anyone who asked.

    # Single-page app: unknown paths are routes, not missing files. This is what
    # makes /app/discover survive a browser refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Same inheritance rule as /assets/ above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
