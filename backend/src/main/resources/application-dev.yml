# Local development: file-backed H2 running in PostgreSQL compatibility mode.
# The schema is the same portable SQL that runs against PostgreSQL, so switching
# to the `postgres` profile requires no code or migration changes.
spring:
  datasource:
    url: jdbc:h2:file:./data/careerflux;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.careerflux: DEBUG
