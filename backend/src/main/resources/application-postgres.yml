# PostgreSQL profile. Run with: --spring.profiles.active=postgres
# Create the database first:  CREATE DATABASE careerflux;
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careerflux}
    # No fallback. A deployment that forgets these should fail to start rather
    # than quietly try a guessable pair and connect to whatever answers.
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: careerflux-pool
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
